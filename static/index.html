<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Tourisafe Admin Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
    <style>html,body,#map{height:100%;margin:0;padding:0} #controls{position:absolute;top:10px;left:10px;z-index:1000;background:white;padding:8px;border-radius:6px}</style>
  </head>
  <body>
    <header class="topbar">
      <div class="brand"><img src="/static/logo.svg" alt="Tourisafe" class="logo-img">Tourisafe</div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px">
        <div class="small-muted">Admin Dashboard</div>
        <div class="controls">
          <button id="adminLoginBtn" class="ghost">Admin Login</button>
        </div>
      </div>
    </header>
    <main class="map-wrap">
      <div id="map"></div>
      <aside class="sidebar">
          <div class="card">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><strong>Active Incidents</strong><a class="small-muted" href="/api/incidents">API</a></div>
            <div id="incidentList" class="list status">No incidents yet</div>
          </div>
      </aside>
    </main>
      <!-- Incident details modal -->
      <div id="incidentModal" class="modal-backdrop" style="display:none">
        <div class="modal">
          <h3>Incident Details</h3>
          <div id="incidentDetails"></div>
          <div class="actions"><button id="incidentClose" class="ghost">Close</button></div>
        </div>
      </div>
    <!-- Admin login modal -->
    <div id="adminModal" class="modal-backdrop" style="display:none">
      <div class="modal">
        <h3>Admin Login</h3>
        <div class="form-row"><label>Username</label><input id="admin_user" /></div>
        <div class="form-row"><label>Password</label><input id="admin_pass" type="password" /></div>
        <div class="actions"><button id="adminCancel" class="ghost">Cancel</button><button id="adminSubmit" class="primary">Login</button></div>
      </div>
    </div>

    <!-- Admin register/reset UI removed for a cleaner admin experience -->

    <!-- Fence create modal -->
    <div id="fenceModal" class="modal-backdrop" style="display:none">
      <div class="modal">
        <h3>Create Fence</h3>
        <div class="form-row"><label>Name</label><input id="fence_name" /></div>
        <div class="form-row"><label>Type</label>
          <select id="fence_type"><option value="restricted">Restricted</option><option value="safe">Safe</option><option value="high-risk">High-risk</option></select>
        </div>
        <div class="actions"><button id="fenceCancel" class="ghost">Cancel</button><button id="fenceCreate" class="primary">Save Fence</button></div>
      </div>
    </div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
    <link rel="stylesheet" href="/static/styles.css?v=1">
    <script src="/static/admin.js?v=2"></script>
  </body>
</html>
