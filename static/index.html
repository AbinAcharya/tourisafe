<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Tourisafe Admin Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
    <style>html,body,#map{height:100%;margin:0;padding:0} #controls{position:absolute;top:10px;left:10px;z-index:1000;background:white;padding:8px;border-radius:6px}</style>
  </head>
  <body>
    <header class="topbar">
      <div class="brand"><img src="/static/logo.svg" alt="Tourisafe" class="logo-img">Tourisafe</div>
      <div class="topbar-actions">
        <div class="small-muted"><span class="live-dot"></span>Operations center</div>
        <div class="controls">
          <button id="adminLoginBtn" class="ghost"><span class="button-icon">&#8594;</span> Admin Login</button>
          <div class="session-menu" id="adminSession" hidden>
            <button id="adminSessionBtn" class="session-button" aria-expanded="false"><span class="avatar">A</span><span>Admin</span><span class="chevron">&#8964;</span></button>
            <div class="session-dropdown" id="adminSessionMenu" hidden><button id="adminLogout" class="dropdown-action">Sign out</button></div>
          </div>
          <button id="adminNotifications" class="icon-button" aria-label="Open notifications" title="Notifications"><span>&#128276;</span><b id="adminNotificationCount" hidden>0</b></button>
        </div>
      </div>
    </header>
    <main class="map-wrap">
      <div id="map"></div>
      <div class="map-toolbar" aria-label="Map controls">
        <button id="adminZoomIn" class="map-tool" aria-label="Zoom in" title="Zoom in">+</button>
        <button id="adminZoomOut" class="map-tool" aria-label="Zoom out" title="Zoom out">&#8722;</button>
        <span class="toolbar-rule"></span>
        <button id="adminResetView" class="map-tool map-tool-wide" aria-label="Reset map view" title="Reset map view">&#9678;</button>
        <button id="adminFullscreen" class="map-tool map-tool-wide" aria-label="Toggle fullscreen map" title="Toggle fullscreen map">&#9974;</button>
      </div>
      <button id="incidentToggle" class="incident-toggle" aria-expanded="false"><span class="incident-toggle-icon">!</span><span><strong>Active incidents</strong><small><b id="incidentCount">0</b> requiring attention</small></span><span class="chevron">&#8964;</span></button>
      <aside class="incident-popup" id="incidentPopup" hidden>
        <div class="card incident-card">
          <div class="card-heading"><div><span class="section-kicker">Live response</span><strong>Active incidents</strong></div><button id="clearIncidents" class="text-button danger-text">Clear all</button></div>
          <div id="incidentList" class="list status">No incidents yet</div>
          <a class="small-muted panel-link" href="/api/incidents">View incident API</a>
        </div>
      </aside>
    </main>
    <aside class="notification-drawer" id="adminNotificationDrawer" aria-label="Notifications" hidden>
      <div class="drawer-heading"><div><span class="section-kicker">Activity</span><strong>Notifications</strong></div><button id="adminClearNotifications" class="text-button">Clear</button></div>
      <div id="adminNotificationList" class="notification-list"><div class="empty-state">No new activity</div></div>
    </aside>
      <!-- Incident details modal -->
      <div id="incidentModal" class="modal-backdrop" style="display:none">
        <div class="modal">
          <h3>Incident Details</h3>
          <div id="incidentDetails"></div>
          <div class="actions"><button id="incidentClose" class="ghost">Close</button></div>
        </div>
      </div>
    <!-- Admin login modal -->
    <div id="adminModal" class="modal-backdrop" style="display:none">
      <div class="modal">
        <h3>Admin Login</h3>
        <div class="form-row"><label>Username</label><input id="admin_user" /></div>
        <div class="form-row"><label>Password</label><input id="admin_pass" type="password" /></div>
        <div class="actions"><button id="adminCancel" class="ghost">Cancel</button><button id="adminSubmit" class="primary">Login</button></div>
      </div>
    </div>

    <!-- Admin register/reset UI removed for a cleaner admin experience -->

    <!-- Fence create modal -->
    <div id="fenceModal" class="modal-backdrop" style="display:none">
      <div class="modal">
        <h3>Create Fence</h3>
        <div class="form-row"><label>Name</label><input id="fence_name" /></div>
        <div class="form-row"><label>Type</label>
          <select id="fence_type"><option value="restricted">Restricted</option><option value="safe">Safe</option><option value="high-risk">High-risk</option></select>
        </div>
        <div class="actions"><button id="fenceCancel" class="ghost">Cancel</button><button id="fenceCreate" class="primary">Save Fence</button></div>
      </div>
    </div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
    <link rel="stylesheet" href="/static/styles.css?v=3">
    <script src="/static/admin.js?v=5"></script>
  </body>
</html>
