<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Tourisafe Admin Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>html,body,#map{height:100%;margin:0;padding:0} #controls{position:absolute;top:10px;left:10px;z-index:1000;background:white;padding:8px;border-radius:6px}</style>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">Tourisafe — Admin</div>
      <div class="controls">
        <button id="refresh" class="ghost">Refresh</button>
        <button id="sos" class="primary">Trigger SOS (demo)</button>
        <button id="adminLoginBtn" class="ghost">Admin Login</button>
        <button id="adminRegisterBtn" class="ghost">Create Admin</button>
        <button id="adminResetBtn" class="ghost">Reset Admin PW</button>
      </div>
    </header>
    <main class="map-wrap">
      <div id="map"></div>
      <aside class="sidebar">
        <div class="panel">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><strong>Active Incidents</strong><a href="/api/incidents">View API</a></div>
          <div id="incidentList" class="list status">No incidents yet</div>
        </div>
      </aside>
    </main>
      <!-- Incident details modal -->
      <div id="incidentModal" class="modal-backdrop" style="display:none">
        <div class="modal">
          <h3>Incident Details</h3>
          <div id="incidentDetails"></div>
          <div class="actions"><button id="incidentClose" class="ghost">Close</button></div>
        </div>
      </div>
    <!-- Admin login modal -->
    <div id="adminModal" class="modal-backdrop" style="display:none">
      <div class="modal">
        <h3>Admin Login</h3>
        <div class="form-row"><label>Username</label><input id="admin_user" /></div>
        <div class="form-row"><label>Password</label><input id="admin_pass" type="password" /></div>
        <div class="actions"><button id="adminCancel" class="ghost">Cancel</button><button id="adminSubmit" class="primary">Login</button></div>
      </div>
    </div>

    <!-- Admin register modal -->
    <div id="adminRegisterModal" class="modal-backdrop" style="display:none">
      <div class="modal">
        <h3>Create Admin</h3>
        <div class="form-row"><label>Username</label><input id="admin_reg_user" /></div>
        <div class="form-row"><label>Email</label><input id="admin_reg_email" /></div>
        <div class="form-row"><label>Password</label><input id="admin_reg_pass" type="password" /></div>
        <div class="actions"><button id="adminRegCancel" class="ghost">Cancel</button><button id="adminRegSubmit" class="primary">Create</button></div>
      </div>
    </div>

    <!-- Admin reset modal -->
    <div id="adminResetModal" class="modal-backdrop" style="display:none">
      <div class="modal">
        <h3>Reset Admin Password</h3>
        <div class="form-row"><label>Target Username</label><input id="admin_reset_user" /></div>
        <div class="form-row"><label>New Password</label><input id="admin_reset_pass" type="password" /></div>
        <div class="actions"><button id="adminResetCancel" class="ghost">Cancel</button><button id="adminResetSubmit" class="primary">Reset</button></div>
      </div>
    </div>

    <!-- Fence create modal -->
    <div id="fenceModal" class="modal-backdrop" style="display:none">
      <div class="modal">
        <h3>Create Fence</h3>
        <div class="form-row"><label>Name</label><input id="fence_name" /></div>
        <div class="form-row"><label>Type</label>
          <select id="fence_type"><option value="restricted">Restricted</option><option value="safe">Safe</option><option value="high-risk">High-risk</option></select>
        </div>
        <div class="actions"><button id="fenceCancel" class="ghost">Cancel</button><button id="fenceCreate" class="primary">Save Fence</button></div>
      </div>
    </div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
    <link rel="stylesheet" href="/static/styles.css?v=1">
    <script src="/static/admin.js?v=2"></script>
  </body>
</html>
