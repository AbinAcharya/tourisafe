<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Tourist - Tourisafe</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
    <style>html,body,#map{height:70%;margin:0;padding:0} #panel{padding:8px}</style>
  </head>
  <body>
    <header class="topbar">
      <div class="brand"><img src="/static/logo.svg" alt="Tourisafe" class="logo-img">Tourisafe</div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px">
        <div class="small-muted">Personal Safety • Tourist View</div>
        <div class="controls">
          <button id="registerBtn" class="ghost">Register</button>
          <button id="loginBtn" class="ghost">Login</button>
          <button id="startTelemetry" class="primary">Start</button>
          <button id="stopTelemetry" class="ghost" disabled>Stop</button>
        </div>
      </div>
    </header>
    <main class="map-wrap">
      <div id="map"></div>
      <div style="position:absolute;left:16px;bottom:16px;z-index:1000">
        <div class="panel status" id="status">Status: idle</div>
      </div>
    </main>
    <!-- Floating SOS button -->
    <button id="sosBtn" class="fab-sos" title="Send SOS">SOS</button>
    <!-- Auth modal -->
    <div id="authModal" class="modal-backdrop" style="display:none">
      <div class="modal">
        <h3 id="authTitle">Login</h3>
        <div class="form-row"><label>Username</label><input id="auth_user" /></div>
        <div class="form-row"><label>Email (for register)</label><input id="auth_email" /></div>
        <div class="form-row"><label>Password</label><input id="auth_pass" type="password" /></div>
        <div class="actions"><button id="authCancel" class="ghost">Cancel</button><button id="authSubmit" class="primary">Submit</button></div>
      </div>
    </div>
    <link rel="stylesheet" href="/static/styles.css?v=1">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="/static/tourist.js?v=2"></script>
  </body>
</html>
