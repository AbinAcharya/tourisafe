<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Tourist - Tourisafe</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>html,body,#map{height:70%;margin:0;padding:0} #panel{padding:8px}</style>
  </head>
  <body>
    <div id="panel">
      <button id="registerBtn">Register</button>
      <button id="loginBtn">Login</button>
      <button id="startTelemetry">Start Telemetry</button>
      <button id="stopTelemetry">Stop Telemetry</button>
      <button id="sosBtn">Send SOS</button>
      <div id="status"></div>
    </div>
    <div id="map"></div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="/static/tourist.js"></script>
  </body>
</html>
