<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tourisafe — Admin Dashboard</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0f172a; --surface: #1e293b; --border: #334155;
      --text: #f1f5f9; --muted: #94a3b8; --accent: #22d3ee;
      --danger: #ef4444; --success: #22c55e; --warning: #f59e0b;
    }
    body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); }
    #app { display: flex; height: 100vh; }
    #sidebar {
      width: 320px; background: var(--surface); border-right: 1px solid var(--border);
      display: flex; flex-direction: column; overflow: hidden;
    }
    #sidebar header {
      padding: 20px; border-bottom: 1px solid var(--border);
    }
    #sidebar header h1 { font-size: 1.25rem; color: var(--accent); }
    #sidebar header p { font-size: 0.8rem; color: var(--muted); margin-top: 4px; }
    .tabs {
      display: flex; border-bottom: 1px solid var(--border);
    }
    .tabs button {
      flex: 1; padding: 10px; background: none; border: none; color: var(--muted);
      cursor: pointer; font-size: 0.85rem; transition: all 0.2s;
    }
    .tabs button.active, .tabs button:hover {
      color: var(--accent); border-bottom: 2px solid var(--accent);
    }
    .panel { flex: 1; overflow-y: auto; padding: 12px; display: none; }
    .panel.active { display: block; }
    .card {
      background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
      padding: 12px; margin-bottom: 8px; transition: border-color 0.2s;
    }
    .card:hover { border-color: var(--accent); }
    .card h3 { font-size: 0.9rem; margin-bottom: 4px; }
    .card p { font-size: 0.78rem; color: var(--muted); }
    .badge {
      display: inline-block; padding: 2px 8px; border-radius: 12px;
      font-size: 0.7rem; font-weight: 600;
    }
    .badge-danger { background: var(--danger); color: #fff; }
    .badge-success { background: var(--success); color: #fff; }
    .badge-warning { background: var(--warning); color: #000; }
    #map { flex: 1; z-index: 0; }
    .sos-dot { background: var(--danger); border: 2px solid #fff; border-radius: 50%; }
    .tourist-dot { background: var(--accent); border: 2px solid #fff; border-radius: 50%; }
    .sos-card { border-left: 3px solid var(--danger) !important; }
    .btn {
      padding: 6px 12px; border-radius: 6px; border: none; cursor: pointer;
      font-size: 0.78rem; font-weight: 600; transition: all 0.2s;
    }
    .btn-resolve { background: var(--success); color: #fff; }
    .btn-resolve:hover { opacity: 0.85; }
    .count-badge {
      background: var(--danger); color: #fff; border-radius: 10px;
      padding: 1px 7px; font-size: 0.7rem; margin-left: 6px;
    }
    @media (max-width: 768px) {
      #app { flex-direction: column-reverse; }
      #sidebar { width: 100%; height: 40vh; }
      #map { height: 60vh; }
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="sidebar">
      <header>
        <h1>🛡️ Tourisafe</h1>
        <p>Admin Dashboard</p>
      </header>
      <div class="tabs">
        <button class="active" onclick="showPanel('tourists')">Tourists</button>
        <button onclick="showPanel('alerts')">Alerts <span id="alert-count" class="count-badge" style="display:none">0</span></button>
        <button onclick="showPanel('zones')">Zones</button>
      </div>
      <div id="panel-tourists" class="panel active"></div>
      <div id="panel-alerts" class="panel"></div>
      <div id="panel-zones" class="panel"></div>
    </div>
    <div id="map"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // --- Auth token from URL or localStorage ---
    const params = new URLSearchParams(window.location.search);
    const tokenFromUrl = params.get('token');
    if (tokenFromUrl) {
      localStorage.setItem('tourisafe_token', tokenFromUrl);
      window.history.replaceState({}, '', '/'); // clean URL
    }
    const AUTH_TOKEN = localStorage.getItem('tourisafe_token');
    if (!AUTH_TOKEN) window.location.href = '/login';

    const headers = { 'Authorization': `Bearer ${AUTH_TOKEN}`, 'Content-Type': 'application/json' };
    const API = '';  // same origin

    // --- Map ---
    const map = L.map('map').setView([20, 0], 2);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      attribution: '© OpenStreetMap © CARTO', maxZoom: 19
    }).addTo(map);

    let touristMarkers = {};
    let sosMarkers = {};

    // --- Tabs ---
    function showPanel(name) {
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
      document.getElementById('panel-' + name).classList.add('active');
      event.target.classList.add('active');
    }

    // --- Fetch tourists ---
    async function loadTourists() {
      try {
        const res = await fetch(`${API}/api/admin/tourists`, { headers });
        if (!res.ok) throw new Error(res.status);
        const tourists = await res.json();
        renderTourists(tourists);
        updateMap(tourists);
      } catch (e) {
        document.getElementById('panel-tourists').innerHTML = `<p style="color:var(--muted);padding:20px;text-align:center">Failed to load tourists</p>`;
      }
    }

    function renderTourists(tourists) {
      const panel = document.getElementById('panel-tourists');
      if (!tourists.length) {
        panel.innerHTML = '<p style="color:var(--muted);padding:20px;text-align:center">No tourists registered yet</p>';
        return;
      }
      panel.innerHTML = tourists.map(t => `
        <div class="card">
          <h3>${t.name}</h3>
          <p>${t.email}</p>
          <p>Last seen: ${t.last_seen ? new Date(t.last_seen).toLocaleTimeString() : 'Never'}</p>
          <span class="badge ${t.is_in_zone ? 'badge-success' : 'badge-warning'}">
            ${t.is_in_zone ? 'In Zone' : 'Outside Zone'}
          </span>
        </div>
      `).join('');
    }

    function updateMap(tourists) {
      // Clear old markers
      Object.values(touristMarkers).forEach(m => map.removeLayer(m));
      touristMarkers = {};

      tourists.forEach(t => {
        if (t.lat && t.lng) {
          const icon = L.divIcon({ className: 'tourist-dot', iconSize: [14, 14] });
          const marker = L.marker([t.lat, t.lng], { icon }).addTo(map)
            .bindPopup(`<b>${t.name}</b><br>${t.email}<br>Seen: ${t.last_seen ? new Date(t.last_seen).toLocaleTimeString() : 'N/A'}`);
          touristMarkers[t.user_id] = marker;
        }
      });
    }

    // --- Fetch alerts ---
    async function loadAlerts() {
      try {
        const res = await fetch(`${API}/api/admin/alerts`, { headers });
        if (!res.ok) throw new Error(res.status);
        const alerts = await res.json();
        renderAlerts(alerts);
        updateAlertBadge(alerts);
        showSosMarkers(alerts);
      } catch (e) {
        document.getElementById('panel-alerts').innerHTML = `<p style="color:var(--muted);padding:20px;text-align:center">Failed to load alerts</p>`;
      }
    }

    function renderAlerts(alerts) {
      const panel = document.getElementById('panel-alerts');
      if (!alerts.length) {
        panel.innerHTML = '<p style="color:var(--muted);padding:20px;text-align:center">No alerts 🎉</p>';
        return;
      }
      panel.innerHTML = alerts.map(a => `
        <div class="card ${a.status === 'active' ? 'sos-card' : ''}">
          <h3>${a.tourist_name} <span class="badge badge-${a.status === 'active' ? 'danger' : 'success'}">${a.status}</span></h3>
          <p>${a.message || 'SOS'}</p>
          <p>Location: ${a.lat ? a.lat.toFixed(4) : '?'}, ${a.lng ? a.lng.toFixed(4) : '?'}</p>
          <p>${new Date(a.created_at).toLocaleString()}</p>
          ${a.status !== 'resolved' ? `<button class="btn btn-resolve" onclick="resolveAlert(${a.id})">✓ Resolve</button>` : ''}
        </div>
      `).join('');
    }

    function updateAlertBadge(alerts) {
      const active = alerts.filter(a => a.status === 'active').length;
      const badge = document.getElementById('alert-count');
      if (active > 0) { badge.textContent = active; badge.style.display = ''; }
      else { badge.style.display = 'none'; }
    }

    function showSosMarkers(alerts) {
      Object.values(sosMarkers).forEach(m => map.removeLayer(m));
      sosMarkers = {};
      alerts.filter(a => a.status === 'active' && a.lat && a.lng).forEach(a => {
        const icon = L.divIcon({ className: 'sos-dot', iconSize: [18, 18] });
        const marker = L.marker([a.lat, a.lng], { icon }).addTo(map)
          .bindPopup(`<b style="color:red">SOS</b><br>${a.tourist_name}<br>${a.message || ''}`);
        sosMarkers[a.id] = marker;
      });
    }

    async function resolveAlert(id) {
      await fetch(`${API}/api/admin/alerts/${id}`, {
        method: 'PATCH', headers,
        body: JSON.stringify({ status: 'resolved' })
      });
      loadAlerts();
    }

    // --- Refresh loop ---
    loadTourists();
    loadAlerts();
    setInterval(() => { loadTourists(); loadAlerts(); }, 5000);
  </script>
</body>
</html>
