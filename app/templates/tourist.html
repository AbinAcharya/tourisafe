<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Tourisafe — Tourist Safety</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0f172a; --surface: #1e293b; --surface2: #253347;
      --border: #334155; --text: #f1f5f9; --muted: #94a3b8;
      --accent: #22d3ee; --danger: #ef4444; --success: #22c55e;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif; background: var(--bg);
      color: var(--text); min-height: 100vh; min-height: 100dvh;
    }

    /* ---- Header ---- */
    .app-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 20px; background: var(--surface); border-bottom: 1px solid var(--border);
    }
    .app-header h1 { font-size: 1.1rem; }
    .app-header .user-info {
      display: flex; align-items: center; gap: 8px;
    }
    .app-header .user-info img { width: 28px; height: 28px; border-radius: 50%; }
    .app-header .user-info span { font-size: 0.8rem; color: var(--muted); }
    .btn-logout {
      background: none; border: 1px solid var(--border); color: var(--muted);
      padding: 4px 10px; border-radius: 6px; cursor: pointer; font-size: 0.75rem;
    }

    /* ---- Tabs ---- */
    .nav-tabs {
      display: flex; background: var(--surface); border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 10;
    }
    .nav-tabs button {
      flex: 1; padding: 14px 8px; background: none; border: none; color: var(--muted);
      font-size: 0.85rem; cursor: pointer; transition: all 0.2s;
      /* 44px min touch target for accessibility */
      min-height: 44px;
    }
    .nav-tabs button.active, .nav-tabs button:hover {
      color: var(--accent); border-bottom: 2px solid var(--accent);
    }

    /* ---- Page containers ---- */
    .page { display: none; padding: 20px; padding-bottom: 100px; }
    .page.active { display: block; }

    /* ---- SOS Button ---- */
    .sos-section { text-align: center; padding: 40px 20px; }
    .sos-btn {
      width: 180px; height: 180px; border-radius: 50%; border: none;
      background: var(--danger); color: #fff; font-size: 1.5rem; font-weight: 800;
      cursor: pointer; box-shadow: 0 0 40px rgba(239, 68, 68, 0.4);
      transition: all 0.15s; min-width: 44px; min-height: 44px;
      /* WCAG: large target, high contrast */
      -webkit-tap-highlight-color: transparent;
    }
    .sos-btn:hover, .sos-btn:active { transform: scale(0.95); box-shadow: 0 0 60px rgba(239, 68, 68, 0.6); }
    .sos-btn:active { animation: sos-pulse 0.5s; }
    @keyframes sos-pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }
    .sos-status {
      margin-top: 20px; padding: 12px; border-radius: 8px; font-size: 0.9rem; display: none;
    }
    .sos-status.show { display: block; }
    .sos-status.sent { background: var(--success); color: #000; }
    .sos-status.error { background: var(--danger); color: #fff; }
    .sos-hint { color: var(--muted); font-size: 0.8rem; margin-top: 12px; }

    /* ---- Map ---- */
    #tourist-map { height: 350px; border-radius: 10px; margin-top: 12px; border: 1px solid var(--border); }

    /* ---- Profile form ---- */
    .form-group { margin-bottom: 16px; }
    .form-group label {
      display: block; font-size: 0.8rem; color: var(--muted); margin-bottom: 6px;
      /* Accessible: explicit labels for all inputs */
    }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px;
      background: var(--surface2); color: var(--text); font-size: 1rem;
      /* 1rem min font size, 44px min touch target */
      min-height: 44px;
    }
    .form-group textarea { min-height: 80px; resize: vertical; }
    .btn-save {
      width: 100%; padding: 14px; border: none; border-radius: 8px;
      background: var(--accent); color: #000; font-size: 1rem; font-weight: 700;
      cursor: pointer; min-height: 44px;
    }
    .btn-save:hover { opacity: 0.9; }

    /* ---- Status indicator ---- */
    .zone-status {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 16px; border-radius: 20px; font-size: 0.85rem; font-weight: 600;
    }
    .zone-safe { background: rgba(34, 197, 94, 0.15); color: var(--success); }
    .zone-unsafe { background: rgba(239, 68, 68, 0.15); color: var(--danger); }

    /* ---- Language selector ---- */
    .lang-selector {
      display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px;
    }
    .lang-btn {
      padding: 8px 16px; border: 1px solid var(--border); border-radius: 6px;
      background: var(--surface); color: var(--muted); cursor: pointer;
      font-size: 0.85rem; min-height: 44px; transition: all 0.2s;
    }
    .lang-btn.active { background: var(--accent); color: #000; border-color: var(--accent); }

    /* ---- Responsive ---- */
    @media (min-width: 600px) {
      .page { max-width: 500px; margin: 0 auto; }
    }

    /* ---- High contrast mode support ---- */
    @media (prefers-contrast: high) {
      :root { --border: #fff; }
      .card, .form-group input { border-width: 2px; }
    }

    /* ---- Reduced motion ---- */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }

    /* ---- Screen reader only ---- */
    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
    }
  </style>
</head>
<body>
  <div class="app-header">
    <h1>🛡️ Tourisafe</h1>
    <div class="user-info">
      <img id="user-avatar" src="" alt="" style="display:none" />
      <span id="user-name"></span>
      <button class="btn-logout" onclick="logout()" aria-label="Log out">Logout</button>
    </div>
  </div>

  <nav class="nav-tabs" role="tablist" aria-label="Main navigation">
    <button class="active" role="tab" aria-selected="true" onclick="showPage('sos')" aria-controls="page-sos">🆘 SOS</button>
    <button role="tab" aria-selected="false" onclick="showPage('map')" aria-controls="page-map">📍 Map</button>
    <button role="tab" aria-selected="false" onclick="showPage('profile')" aria-controls="page-profile">👤 Profile</button>
    <button role="tab" aria-selected="false" onclick="showPage('settings')" aria-controls="page-settings">⚙️ Settings</button>
  </nav>

  <!-- SOS Page -->
  <div id="page-sos" class="page active" role="tabpanel">
    <div class="sos-section">
      <div id="zone-indicator" class="zone-status zone-safe" aria-live="polite">
        <span>●</span> <span id="zone-text">You are in a safe zone</span>
      </div>

      <div style="margin-top: 30px;">
        <button class="sos-btn" id="sos-btn" onclick="triggerSOS()" aria-label="Send SOS emergency alert. Press and hold for emergency assistance.">
          🆘<br>SOS
        </button>
        <p class="sos-hint">Tap for emergency assistance</p>
        <p class="sos-hint" aria-live="polite" id="battery-info"></p>
      </div>

      <div id="sos-status" class="sos-status" role="alert" aria-live="assertive"></div>
    </div>
  </div>

  <!-- Map Page -->
  <div id="page-map" class="page" role="tabpanel">
    <h2 style="margin-bottom: 12px; font-size: 1rem;">Your Location</h2>
    <div id="tourist-map"></div>
    <p style="color: var(--muted); font-size: 0.8rem; margin-top: 8px;" aria-live="polite" id="location-status">Acquiring location...</p>
  </div>

  <!-- Profile Page -->
  <div id="page-profile" class="page" role="tabpanel">
    <h2 style="margin-bottom: 16px; font-size: 1rem;">Emergency Profile</h2>
    <p style="color: var(--muted); font-size: 0.8rem; margin-bottom: 20px;">
      Fill this in so emergency responders have your info.
    </p>
    <form id="profile-form" onsubmit="saveProfile(event)">
      <div class="form-group">
        <label for="profile-nationality">Nationality</label>
        <input id="profile-nationality" type="text" placeholder="e.g. United States" />
      </div>
      <div class="form-group">
        <label for="profile-emergency-name">Emergency Contact Name</label>
        <input id="profile-emergency-name" type="text" placeholder="e.g. Jane Doe" />
      </div>
      <div class="form-group">
        <label for="profile-emergency-phone">Emergency Contact Phone</label>
        <input id="profile-emergency-phone" type="tel" placeholder="+1 555 123 4567" />
      </div>
      <div class="form-group">
        <label for="profile-blood-type">Blood Type</label>
        <input id="profile-blood-type" type="text" placeholder="e.g. O+" />
      </div>
      <div class="form-group">
        <label for="profile-allergies">Allergies / Medical Notes</label>
        <textarea id="profile-allergies" placeholder="e.g. Penicillin allergy, asthma"></textarea>
      </div>
      <button type="submit" class="btn-save">Save Profile</button>
    </form>
    <div id="profile-status" style="margin-top: 12px; text-align: center; font-size: 0.85rem;" aria-live="polite"></div>
  </div>

  <!-- Settings Page -->
  <div id="page-settings" class="page" role="tabpanel">
    <h2 style="margin-bottom: 16px; font-size: 1rem;">Language</h2>
    <div class="lang-selector" role="radiogroup" aria-label="Select language">
      <button class="lang-btn active" role="radio" aria-checked="true" onclick="setLang('en', this)">🇬🇧 English</button>
      <button class="lang-btn" role="radio" aria-checked="false" onclick="setLang('fr', this)">🇫🇷 Français</button>
      <button class="lang-btn" role="radio" aria-checked="false" onclick="setLang('es', this)">🇪🇸 Español</button>
      <button class="lang-btn" role="radio" aria-checked="false" onclick="setLang('de', this)">🇩🇪 Deutsch</button>
      <button class="lang-btn" role="radio" aria-checked="false" onclick="setLang('ja', this)">🇯🇵 日本語</button>
      <button class="lang-btn" role="radio" aria-checked="false" onclick="setLang('zh', this)">🇨🇳 中文</button>
      <button class="lang-btn" role="radio" aria-checked="false" onclick="setLang('hi', this)">🇮🇳 हिन्दी</button>
      <button class="lang-btn" role="radio" aria-checked="false" onclick="setLang('ar', this)">🇸🇦 العربية</button>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // --- Auth ---
    const params = new URLSearchParams(window.location.search);
    const tokenFromUrl = params.get('token');
    if (tokenFromUrl) {
      localStorage.setItem('tourisafe_token', tokenFromUrl);
      window.history.replaceState({}, '', '/tourist');
    }
    const AUTH_TOKEN = localStorage.getItem('tourisafe_token');
    if (!AUTH_TOKEN) window.location.href = '/login';

    const headers = { 'Authorization': `Bearer ${AUTH_TOKEN}`, 'Content-Type': 'application/json' };

    // --- Navigation ---
    function showPage(name) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.nav-tabs button').forEach(b => {
        b.classList.remove('active');
        b.setAttribute('aria-selected', 'false');
      });
      document.getElementById('page-' + name).classList.add('active');
      event.target.classList.add('active');
      event.target.setAttribute('aria-selected', 'true');
    }

    // --- User info ---
    async function loadUser() {
      try {
        const res = await fetch('/auth/me', { headers });
        if (!res.ok) throw new Error();
        const user = await res.json();
        document.getElementById('user-name').textContent = user.name;
        if (user.avatar_url) {
          const img = document.getElementById('user-avatar');
          img.src = user.avatar_url;
          img.alt = user.name + "'s avatar";
          img.style.display = '';
        }
        // Set language
        if (user.preferred_language) {
          document.querySelectorAll('.lang-btn').forEach(b => {
            b.classList.remove('active');
            b.setAttribute('aria-checked', 'false');
          });
        }
      } catch {
        logout();
      }
    }

    function logout() {
      localStorage.removeItem('tourisafe_token');
      window.location.href = '/login';
    }

    // --- SOS ---
    let sosCooldown = false;
    async function triggerSOS() {
      if (sosCooldown) return;
      sosCooldown = true;
      const btn = document.getElementById('sos-btn');
      const status = document.getElementById('sos-status');
      btn.disabled = true;

      // Haptic feedback (vibration API)
      if (navigator.vibrate) navigator.vibrate([200, 100, 200]);

      try {
        const res = await fetch('/api/tourist/sos', {
          method: 'POST', headers,
          body: JSON.stringify({ message: 'SOS — Tourist pressed emergency button' })
        });
        const data = await res.json();
        status.textContent = data.message || 'SOS sent!';
        status.className = 'sos-status show sent';
        // Vibrate confirmation
        if (navigator.vibrate) navigator.vibrate([100, 50, 100, 50, 100]);
      } catch (e) {
        status.textContent = '⚠️ Failed to send SOS. Retrying...';
        status.className = 'sos-status show error';
        // Queue for retry (offline support)
        queueOfflineSOS();
      }

      setTimeout(() => { sosCooldown = false; btn.disabled = false; }, 5000);
    }

    // --- Offline SOS queue ---
    function queueOfflineSOS() {
      const queue = JSON.parse(localStorage.getItem('tourisafe_sos_queue') || '[]');
      queue.push({ timestamp: new Date().toISOString(), message: 'SOS — queued offline' });
      localStorage.setItem('tourisafe_sos_queue', JSON.stringify(queue));
    }

    async function flushOfflineQueue() {
      const queue = JSON.parse(localStorage.getItem('tourisafe_sos_queue') || '[]');
      if (!queue.length) return;
      for (const item of queue) {
        try {
          await fetch('/api/tourist/sos', {
            method: 'POST', headers,
            body: JSON.stringify({ message: item.message })
          });
        } catch { return; } // still offline
      }
      localStorage.removeItem('tourisafe_sos_queue');
    }
    window.addEventListener('online', flushOfflineQueue);

    // --- Location tracking ---
    let touristMap = null;
    let locationWatchId = null;

    function initTouristMap() {
      touristMap = L.map('tourist-map').setView([20, 0], 2);
      L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
        attribution: '© OpenStreetMap © CARTO', maxZoom: 19
      }).addTo(touristMap);

      if ('geolocation' in navigator) {
        locationWatchId = navigator.geolocation.watchPosition(
          pos => {
            const { latitude: lat, longitude: lng, accuracy } = pos.coords;
            touristMap.setView([lat, lng], 14);
            L.circleMarker([lat, lng], { radius: 8, color: '#22d3ee', fillColor: '#22d3ee', fillOpacity: 0.8 })
              .addTo(touristMap).bindPopup('You are here');
            document.getElementById('location-status').textContent = `Location: ${lat.toFixed(4)}, ${lng.toFixed(4)} (±${Math.round(accuracy)}m)`;
            // Send to server
            sendLocation(lat, lng, accuracy);
          },
          err => {
            document.getElementById('location-status').textContent = 'Location access denied';
          },
          { enableHighAccuracy: true, maximumAge: 10000, timeout: 15000 }
        );
      }
    }

    async function sendLocation(lat, lng, accuracy) {
      const batteryLevel = navigator.getBattery ? (await navigator.getBattery()).level * 100 : null;
      try {
        const res = await fetch('/api/tourist/location', {
          method: 'POST', headers,
          body: JSON.stringify({ lat, lng, accuracy, battery_level: batteryLevel ? Math.round(batteryLevel) : null })
        });
        const data = await res.json();
        const indicator = document.getElementById('zone-indicator');
        const text = document.getElementById('zone-text');
        if (data.in_safe_zone) {
          indicator.className = 'zone-status zone-safe';
          text.textContent = 'You are in a safe zone';
        } else {
          indicator.className = 'zone-status zone-unsafe';
          text.textContent = '⚠️ You are outside safe zones';
        }
      } catch {}
    }

    // --- Battery info display ---
    if ('getBattery' in navigator) {
      navigator.getBattery().then(bat => {
        const pct = Math.round(bat.level * 100);
        document.getElementById('battery-info').textContent = `Battery: ${pct}%`;
        bat.addEventListener('levelchange', () => {
          document.getElementById('battery-info').textContent = `Battery: ${Math.round(bat.level * 100)}%`;
        });
      });
    }

    // --- Profile ---
    async function loadProfile() {
      try {
        const res = await fetch('/api/tourist/profile', { headers });
        if (!res.ok) return;
        const p = await res.json();
        if (p.nationality) document.getElementById('profile-nationality').value = p.nationality;
        if (p.emergency_contact_name) document.getElementById('profile-emergency-name').value = p.emergency_contact_name;
        if (p.emergency_contact_phone) document.getElementById('profile-emergency-phone').value = p.emergency_contact_phone;
        if (p.blood_type) document.getElementById('profile-blood-type').value = p.blood_type;
        if (p.allergies) document.getElementById('profile-allergies').value = p.allergies;
      } catch {}
    }

    async function saveProfile(e) {
      e.preventDefault();
      const status = document.getElementById('profile-status');
      try {
        await fetch('/api/tourist/profile', {
          method: 'PUT', headers,
          body: JSON.stringify({
            nationality: document.getElementById('profile-nationality').value,
            emergency_contact_name: document.getElementById('profile-emergency-name').value,
            emergency_contact_phone: document.getElementById('profile-emergency-phone').value,
            blood_type: document.getElementById('profile-blood-type').value,
            allergies: document.getElementById('profile-allergies').value,
          })
        });
        status.textContent = '✓ Profile saved';
        status.style.color = 'var(--success)';
      } catch {
        status.textContent = 'Failed to save';
        status.style.color = 'var(--danger)';
      }
    }

    // --- Language ---
    async function setLang(lang, btn) {
      document.querySelectorAll('.lang-btn').forEach(b => {
        b.classList.remove('active');
        b.setAttribute('aria-checked', 'false');
      });
      btn.classList.add('active');
      btn.setAttribute('aria-checked', 'true');
      try {
        await fetch('/api/tourist/profile', {
          method: 'PUT', headers,
          body: JSON.stringify({ preferred_language: lang })
        });
      } catch {}
    }

    // --- Init ---
    loadUser();
    loadProfile();
    // Lazy-init map when map tab is first shown
    let mapInited = false;
    const observer = new MutationObserver(() => {
      if (!mapInited && document.getElementById('page-map').classList.contains('active')) {
        initTouristMap();
        mapInited = true;
      }
    });
    observer.observe(document.getElementById('page-map'), { attributes: true, attributeFilter: ['class'] });
  </script>
</body>
</html>
