<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tourisafe — Sign In</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0f172a; --surface: #1e293b; --border: #334155;
      --text: #f1f5f9; --muted: #94a3b8; --accent: #22d3ee; --danger: #ef4444;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif; background: var(--bg);
      color: var(--text); min-height: 100vh; display: flex; align-items: center;
      justify-content: center;
    }
    .auth-card {
      width: 100%; max-width: 400px; padding: 32px; background: var(--surface);
      border: 1px solid var(--border); border-radius: 16px;
    }
    .auth-card h1 {
      font-size: 1.5rem; text-align: center; margin-bottom: 4px;
    }
    .auth-card .subtitle {
      text-align: center; color: var(--muted); font-size: 0.85rem; margin-bottom: 24px;
    }
    .google-btn {
      width: 100%; padding: 14px; border: 1px solid var(--border); border-radius: 8px;
      background: #fff; color: #333; font-size: 1rem; font-weight: 600;
      cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px;
      transition: all 0.2s; min-height: 48px;
    }
    .google-btn:hover { background: #f1f1f1; }
    .google-btn img { width: 20px; height: 20px; }
    .divider {
      display: flex; align-items: center; gap: 12px; margin: 20px 0;
      color: var(--muted); font-size: 0.8rem;
    }
    .divider::before, .divider::after {
      content: ''; flex: 1; height: 1px; background: var(--border);
    }
    .form-group { margin-bottom: 14px; }
    .form-group label {
      display: block; font-size: 0.8rem; color: var(--muted); margin-bottom: 6px;
    }
    .form-group input {
      width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px;
      background: var(--bg); color: var(--text); font-size: 1rem; min-height: 44px;
    }
    .form-group input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
    .btn-primary {
      width: 100%; padding: 14px; border: none; border-radius: 8px;
      background: var(--accent); color: #000; font-size: 1rem; font-weight: 700;
      cursor: pointer; min-height: 48px; margin-top: 4px;
    }
    .btn-primary:hover { opacity: 0.9; }
    .toggle {
      text-align: center; margin-top: 16px; font-size: 0.85rem; color: var(--muted);
    }
    .toggle a { color: var(--accent); cursor: pointer; text-decoration: none; }
    .error-msg {
      background: rgba(239,68,68,0.15); color: var(--danger); padding: 10px;
      border-radius: 8px; font-size: 0.85rem; margin-bottom: 14px; display: none;
    }
    .error-msg.show { display: block; }
  </style>
</head>
<body>
  <div class="auth-card" role="main">
    <h1>🛡️ Tourisafe</h1>
    <p class="subtitle">Smart Tourist Safety System</p>

    <!-- Google OAuth -->
    <a href="/auth/google/login" style="text-decoration:none">
      <button class="google-btn" type="button" aria-label="Sign in with Google">
        <svg width="20" height="20" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
        </svg>
        Sign in with Google
      </button>
    </a>

    <div class="divider">or</div>

    <!-- Email / Password -->
    <div id="error-msg" class="error-msg" role="alert" aria-live="assertive"></div>

    <form id="auth-form" onsubmit="handleSubmit(event)">
      <div class="form-group" id="name-group" style="display:none">
        <label for="auth-name">Full Name</label>
        <input id="auth-name" type="text" autocomplete="name" />
      </div>
      <div class="form-group">
        <label for="auth-email">Email</label>
        <input id="auth-email" type="email" autocomplete="email" required />
      </div>
      <div class="form-group">
        <label for="auth-password">Password</label>
        <input id="auth-password" type="password" autocomplete="current-password" required minlength="6" />
      </div>
      <button type="submit" class="btn-primary" id="auth-submit">Sign In</button>
    </form>

    <p class="toggle">
      <span id="toggle-text">Don't have an account?</span>
      <a onclick="toggleMode()" id="toggle-link">Register</a>
    </p>
  </div>

  <script>
    let isRegister = false;

    function toggleMode() {
      isRegister = !isRegister;
      document.getElementById('name-group').style.display = isRegister ? '' : 'none';
      document.getElementById('auth-submit').textContent = isRegister ? 'Register' : 'Sign In';
      document.getElementById('toggle-text').textContent = isRegister ? 'Already have an account?' : "Don't have an account?";
      document.getElementById('toggle-link').textContent = isRegister ? 'Sign In' : 'Register';
      document.getElementById('error-msg').className = 'error-msg';
    }

    async function handleSubmit(e) {
      e.preventDefault();
      const errEl = document.getElementById('error-msg');
      const email = document.getElementById('auth-email').value;
      const password = document.getElementById('auth-password').value;
      const name = document.getElementById('auth-name').value;
      const url = isRegister ? '/auth/register' : '/auth/login';
      const body = isRegister ? { email, password, name } : { email, password };

      try {
        const res = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        const data = await res.json();
        if (!res.ok) {
          errEl.textContent = data.detail || 'Authentication failed';
          errEl.className = 'error-msg show';
          return;
        }
        localStorage.setItem('tourisafe_token', data.access_token);
        // Redirect to admin if admin, tourist otherwise
        if (data.user?.is_admin) {
          window.location.href = '/';
        } else {
          window.location.href = '/tourist';
        }
      } catch (err) {
        errEl.textContent = 'Network error. Please try again.';
        errEl.className = 'error-msg show';
      }
    }
  </script>
</body>
</html>
